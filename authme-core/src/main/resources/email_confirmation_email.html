<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#8080ff">
<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#8080ff" style="background:linear-gradient(135deg,#8080ff,#e89eff)"><tr><td align="center" style="padding:40px 12px">
<table width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fff;border-radius:14px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4a5468"><tr><td style="padding:32px 28px">
<h1 style="margin:0 0 6px;font-size:20px;color:#232838">Hello, <playername /></h1>
<p style="margin:0 0 20px">You requested to add or change the email address on your account on <servername />. Your confirmation code is:</p>
<div style="background:#12172b;border-radius:10px;padding:16px;text-align:center;font-family:Consolas,Menlo,monospace;font-size:28px;letter-spacing:6px;color:#fff"><generatedcode /></div>
<p style="margin:20px 0 6px">Use the command in-game to complete the process:</p>
<p style="margin:0;font-family:Consolas,Menlo,monospace;color:#5f6ae8">/email confirm <generatedcode /></p>
<p style="margin:20px 0 0;font-size:13px;color:#8a94ab">The code expires in <minutesvalid /> minutes. If you did not request this change, please ignore this email.</p>
</td></tr>
<tr><td style="padding:0 28px 24px;font-size:12px;color:#aab6ca">See you on <servername />!</td></tr>
</table>
</td></tr></table>

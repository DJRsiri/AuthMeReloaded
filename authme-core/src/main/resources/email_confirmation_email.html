<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm your new email address</title>
</head>
<body style="margin:0; padding:0; background-color:#8080ff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#8080ff"
       style="background-color:#8080ff; background-image:linear-gradient(135deg, #8080ff 0%, #e89eff 100%);">
  <tr>
    <td align="center" style="padding:48px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="width:100%; max-width:600px; background-color:#1c2130; border-radius:16px;">
        <tr>
          <td style="padding:40px 40px 32px; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
            <h1 style="margin:0 0 8px; font-size:22px; font-weight:600; color:#ffffff;">
                Hello, <playername />
            </h1>
            <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#aab6ca;">
                You requested to add or change the email address on your account on <servername />.
                Your confirmation code is:
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="background-color:#12172b; border:1px solid #8080ff; border-radius:12px; padding:20px;">
                  <span style="font-family:Consolas, Menlo, monospace; font-size:32px; letter-spacing:8px; color:#ffffff;">
<generatedcode />
                  </span>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0; font-size:15px; line-height:1.6; color:#aab6ca;">
                Use the command in-game to complete the process:
            </p>
            <p style="margin:12px 0 0; font-family:Consolas, Menlo, monospace; font-size:14px; color:#e89eff;">
                /email confirm <generatedcode />
            </p>
            <p style="margin:24px 0 0; font-size:13px; line-height:1.6; color:#7e8aa0;">
                The code expires in <minutesvalid /> minutes. If you did not request this change, please ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px 28px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:12px; color:#7e8aa0;">
            See you on <servername />!
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
